<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/rps.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <title>RPS</title>
</head>
<body>
    <p>Rock Paper Scissors Game</p>

    <div class="button-div">
    <button class="js-rock-button  buttons">
       <img class="rock-image" src="img/rock-emoji.png" alt="">
    
    <button class="js-paper-button  buttons">
       <img class="paper-image" src="img/paper-emoji.png" alt=""> 
    </button>

    <button class="js-scissors-button  buttons">
       <img class="scissors-image" src="img/scissors-emoji.png" alt="">
    </button>

    </div>

    <p class="result js-result"></p>
    <p class="moves js-moves"></p>
    <p class="score js-score"></p>

    <div class="reset-autoplay-button">
    <button class="reset-button js-reset-button">
       Reset
    </button>

    <button class="auto-play-button js-auto-play-button">
       Auto Play
    </button>
    </div>


<script src="scripts/rps.js"></script>
</body>
</html>
