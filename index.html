<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS</title>
</head>
<body>
    <p>Rock Paper Scissors Game</p>
    <button class="js-rock-button" onclick="
    
        const computerMove = randomMove();

        let result = ''

        if(computerMove === 'rock'){
            result = 'Tie';
        } else if (computerMove === 'paper'){
            result = 'You lose';
        } else if (computerMove === 'scissors'){
            result = 'You win';
        }

        alert(`You rock - Computer ${computerMove} 
${result}`)
        
    
    ">
        Rock
    </button>
    
    <button class="js-paper-button" onclick="
    
        const computerMove = randomMove();

         let result = ''

        if(computerMove === 'rock'){
            result = 'You win';
        } else if (computerMove === 'paper'){
            result = 'Tie';
        } else if (computerMove === 'scissors'){
            result = 'You lose';
        }

        alert(`You rock - Computer ${computerMove} 
${result}`)
    
    ">
        Paper
    </button>

    <button class="js-scissors-button" onclick="
    
        const computerMove = randomMove();

         let result = ''

        if(computerMove === 'rock'){
            result = 'You lose';
        } else if (computerMove === 'paper'){
            result = 'You win';
        } else if (computerMove === 'scissors'){
            result = 'Tie';
        }

        alert(`You rock - Computer ${computerMove} 
${result}`)
    
    ">
        Scissors
    </button>

<!-- <script src="scripts/index.js"></script> -->
<script>
    function randomMove(){
        const ranmdomNumber = Math.random();

        let computerMove = '';

        if(ranmdomNumber >= 0 && ranmdomNumber < 1/3){
            computerMove = 'rock';
            
        }else if(ranmdomNumber >= 1/3 && ranmdomNumber < 2/3){
            computerMove = 'paper';
            
        }else if(ranmdomNumber > 2/3 && ranmdomNumber < 1){
            computerMove = 'scissors';
            
        }

        return computerMove;

        // console.log(computerMove);
    }



</script>
</body>
</html>
